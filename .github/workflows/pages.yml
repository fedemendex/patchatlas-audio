name: pages

# Deploys examples/playground/dist to GitHub Pages. The root package must be
# built first: the playground's build consumes the root package's built dist
# through its own `exports` map (scripts/copy-assets.mjs), not the
# TypeScript sources -- same order as ci.yml.
#
# All of the playground's asset references (static/index.html) are relative
# ("./main.js", "./styles.css", the import map), so this works unmodified
# under the project-page subpath (https://<owner>.github.io/patchatlas-audio/)
# rather than a custom domain root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run build --workspace=examples/playground

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/playground/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
